name: Release APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (for example v1.0). Empty makes one from the run number'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    name: Build and publish the APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Prepare the signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Add the secret ANDROID_KEYSTORE_BASE64 first, or the release would be signed with a throwaway key"
            exit 1
          fi
          mkdir -p ~/.android
          echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore

      - name: Build the APK
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          LIBREFM_API_KEY: ${{ secrets.LIBREFM_API_KEY }}
          LIBREFM_SECRET: ${{ secrets.LIBREFM_SECRET }}
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
        run: ./gradlew assembleUniversalGmsFork --no-configuration-cache --console=plain --warning-mode summary

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          TAG="${TAG:-build-${{ github.run_number }}}"
          APK=$(ls app/build/outputs/apk/universalGms/fork/*.apk | head -n 1)
          cp "$APK" "Mochy-$TAG.apk"
          gh release create "$TAG" "Mochy-$TAG.apk" \
            --title "Mochy $TAG" \
            --notes "Mochy with SoundCloud, Yandex Music and the other changes of this fork. Built from ${{ github.sha }}." \
            --target "${{ github.sha }}"
